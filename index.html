<!DOCTYPE html>
<html>
<head>
<title> Menu </title>
<script src="https://simplycodingcourses.com/files/simplyjs/simply.js"></script>
<script>
function start(){
sjs.open();
var background = new sjs.Image("Images/background.png");
 background.setSize(500,400)
var menu_text = new sjs.Text("Ice cave", 28, "cyan");
menu_text.centerH();
var instruction_text = new sjs.Text("Use the arrow keys to play!!", 28, "cyan");
instruction_text.centerH().offset(0,50);
var instruction2_text = new sjs.Text("Try to get the highest score!!", 28, "cyan");
instruction2_text.centerH().offset(0,100);
var playBtn = new sjs.Button("play", function(){
	window.location = "customgame.html";
});
playBtn.center().offset(0,50);
var creator_text = new sjs.Text("Made by Wensen Pei", 50, "green");
creator_text.bottom().centerH();
}
</script>
</head>
<body onload="start()">
<h1> Ice cave </h1>

<div id="target" style="margin:auto;background:grey;"></div>
</body>
</html>
